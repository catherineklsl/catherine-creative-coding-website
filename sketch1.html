<!DOCTYPE html>
<html lang="en">
<head>
    <title>Fisheye camera</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
<style>
    body {
        position:relative;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
        background-color: #8acdea;
    }
    h2 {
        position: absolute;
        top: 20px;
        left: 50%;
        transform: translateX(-50%);
        font-size: 35px;
        color: #8c4843;
        font-family: "Shadows Into Light", serif;
    }
    p {
        position: absolute;
        bottom: 60px;
        left: 50%;
        transform: translateX(-50%); 
        font-size: 25px;
        color: #8c4843;
        font-family: "Shadows Into Light", serif;
        white-space: nowrap;
    }
    a{
        position: absolute;
        top: 50px;
        left: 70px;
        font-size: 15px;
        color: #8c4843;
        text-decoration: none;
        border: 2px solid #8c4843;
        padding: 7px 8px;
        border-radius: 5px;
    }
    a.hover{
       text-decoration: underline;
    }
    

</style>
</head>
<body>
<h2>Fisheye Camera</h2>
<p>Put your mouse over the image to see the fisheye effect</p>

</body>
</html>
